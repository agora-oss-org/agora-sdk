name: Publish

# Publishes all @agora-sdk/* packages to npm when a version tag is pushed.
#
# Cut a release with one command (bumps all packages, commits, tags, pushes):
#
#   pnpm run patch        # or: pnpm run minor / pnpm run major
#
# (see scripts/release.sh). The tag (without the leading "v") must match
# @agora-sdk/core's version — the job verifies this below.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
          scope: "@agora-sdk"

      - name: Install dependencies
        # See ci.yml: skip prepare hooks, build explicitly in dependency order.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/core/package.json').version")"
          echo "Tag version: $TAG | @agora-sdk/core version: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match @agora-sdk/core version $PKG. Bump package.json versions before tagging."
            exit 1
          fi

      - name: Build all packages
        run: pnpm run build-all

      - name: Publish to npm
        run: >-
          pnpm
          --filter @agora-sdk/core
          --filter @agora-sdk/react-js
          --filter @agora-sdk/react-native
          --filter @agora-sdk/expo
          publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
