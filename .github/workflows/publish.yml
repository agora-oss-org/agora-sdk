name: Publish

# Publishes all @agora-sdk/* packages to npm when a version tag is pushed, then
# creates the matching GitHub Release with notes from CHANGELOG.md.
#
# Cut a release with one command (bumps all packages, commits, tags, pushes):
#
#   pnpm run patch        # or: pnpm run minor / pnpm run major
#
# (see scripts/release.sh). The tag (without the leading "v") must match
# @agora-sdk/core's version — the job verifies this below.

on:
  push:
    tags:
      - "v*"
    workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create/edit the GitHub Release for the pushed tag

jobs:
  publish:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
          scope: "@agora-sdk"

      - name: Install dependencies
        # See ci.yml: skip prepare hooks, build explicitly in dependency order.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/core/package.json').version")"
          echo "Tag version: $TAG | @agora-sdk/core version: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match @agora-sdk/core version $PKG. Bump package.json versions before tagging."
            exit 1
          fi

      - name: Build all packages
        run: pnpm run build-all

      - name: Publish to npm
        run: >-
          pnpm
          --filter @agora-sdk/core
          --filter @agora-sdk/react-js
          --filter @agora-sdk/react-native
          --filter @agora-sdk/expo
          publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(mktemp)"
          # Extract this version's section: everything between "## [VERSION]" and the
          # next "## " heading, or the "[link]: url" reference block at the file's foot
          # (so the last/oldest section doesn't swallow the link definitions).
          awk -v ver="## [$VERSION]" '
            index($0, ver)==1 {f=1; next}
            f && (/^## / || /^\[[^][]+\]: /) {exit}
            f {print}
          ' CHANGELOG.md > "$NOTES"

          if grep -q '[^[:space:]]' "$NOTES"; then
            # Append a compare link to the previous release — the next version header
            # listed below this one in the CHANGELOG — or the CHANGELOG file if none.
            PREV="$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
                    | sed -E 's/^## \[([0-9.]+)\]/\1/' \
                    | awk -v v="$VERSION" 'p{print "v"$0; exit} $0==v{p=1}')"
            if [ -n "$PREV" ]; then
              printf '\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$PREV" "$GITHUB_REF_NAME" >> "$NOTES"
            else
              printf '\n**Full changelog:** https://github.com/%s/blob/%s/CHANGELOG.md\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> "$NOTES"
            fi
            HAVE_NOTES=1
          else
            echo "No CHANGELOG section for $VERSION — using GitHub auto-generated notes."
            HAVE_NOTES=0
          fi

          # Idempotent: create the release, or refresh its notes if a re-run already made it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$HAVE_NOTES" = 1 ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES"
            else
              echo "Release already exists and no CHANGELOG section — leaving notes as-is."
            fi
          elif [ "$HAVE_NOTES" = 1 ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
