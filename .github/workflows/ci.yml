name: CI

on:
  push:
    branches: [agora]
  pull_request:
    branches: [agora]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck & build all packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts skips the packages' `prepare` build hooks, which run
        # out of dependency order on a clean install (dependents build before
        # @agora-sdk/core's dist exists). We build explicitly via build-all instead.
        run: pnpm install --frozen-lockfile --ignore-scripts

      # build-all runs first: it builds @agora-sdk/core ahead of its dependents,
      # so the root typecheck can resolve @agora-sdk/core's emitted declarations.
      - name: Build all packages
        run: pnpm run build-all

      - name: Typecheck
        run: pnpm run typecheck
